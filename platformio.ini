; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Flash: 4MB QD, PSRAM: 2MB QD
; yoinked from https://github.com/sivar2311/ESP32-S3-PlatformIO-Flash-and-PSRAM-configurations?tab=readme-ov-file#esp32-s3-fh4r2

[env:esp32-s3-devkitc-1]
platform = platformio/espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
; upload_port = /dev/ttyACM0

board_build.bootloader_file = .pio/build/esp32-s3-devkitc-1/bootloader.bin
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.psram_type = qio
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.psram_size = 2MB
upload_speed = 921600
monitor_speed = 921600
board_build.extra_flags = 
  -DBOARD_HAS_PSRAM
  -DCONFIG_ESPTOOLPY_FLASHSIZE_4MB=y
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DLOG_LOCAL_LEVEL=ESP_LOG_INFO
  -ggdb

;  -DCONFIG_ADC_ONESHOT_CTRL_FUNC_IN_IRAM
;  -DCONFIG_SOC_ADC_SUPPORTED=1

;lib_deps =
;  https://github.com/Inteform/esp32-lora-library

; holy shit this does wonders - abdul
monitor_filters = esp32_exception_decoder
build_type = debug